name: Fresh Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Install the version in lean-toolchain and fetch only Mathlib's cache.
      # No project or vendor build cache is restored.
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "true"
      - name: Check verification guardrails
        run: python3 scripts/test_verify.py
      - name: Fresh direct elaboration and endpoint audit
        run: python3 scripts/verify.py --mode direct --jobs 1
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-verification
          path: build/verification/
          retention-days: 14
